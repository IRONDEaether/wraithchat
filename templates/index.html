<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="page-title">WraithChat — Messagerie Éphémère & Secrète</title>
    
    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007AFF">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SCRIPT SOCKET.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        :root {
            --ios-glass: rgba(255, 255, 255, 0.45);
            --ios-glass-dark: rgba(255, 255, 255, 0.25);
            --ios-glass-border: rgba(255, 255, 255, 0.4);
            --ios-blur: blur(30px);
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-text: #1C1C1E;
            --ios-subtext: rgba(60, 60, 67, 0.75);
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #0f172a url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* WRAPPER PRINCIPAL */
        .app-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 920px;
            display: flex;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--ios-glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        /* OVERLAY MOBILE POUR FERMER LA SIDEBAR */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* SIDEBAR (CONTACTS ET PROFIL) */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.35);
            border-right: 1px solid var(--ios-glass-border);
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            overflow-y: auto;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-switch-box {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--ios-glass-border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            color: var(--ios-text);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--ios-glass-border);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .avatar-upload {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--ios-blue);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .avatar-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-inputs {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-save-profile {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--ios-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-save-profile:active { opacity: 0.8; }

        .contacts-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .add-contact-box {
            display: flex;
            gap: 8px;
        }

        .contact-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            position: relative;
        }

        .contact-item:hover, .contact-item:active {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--ios-glass-border);
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            object-fit: cover;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
        }

        .contact-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ios-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-details {
            font-size: 11px;
            color: var(--ios-subtext);
        }

        .unread-dot {
            width: 10px;
            height: 10px;
            background-color: var(--ios-blue);
            border-radius: 50%;
            display: none;
            flex-shrink: 0;
            box-shadow: 0 0 6px var(--ios-blue);
        }

        .unread-dot.active { display: block; }

        .btn-delete-contact {
            background: transparent; border: none; cursor: pointer; padding: 6px; opacity: 0.6;
        }
        .btn-delete-contact:hover { opacity: 1; }
        .btn-delete-contact svg { width: 16px; height: 16px; fill: var(--ios-red); }

        /* VUE CHAT PRINCIPALE */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            min-width: 0;
            background: rgba(255, 255, 255, 0.1);
        }

        /* HEADER MOBILE & DESKTOP */
        .header {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--ios-glass-border);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-toggle {
            display: none;
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--ios-glass-border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            color: var(--ios-text);
        }

        .app-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-logo {
            width: 22px;
            height: 22px;
            fill: var(--ios-text);
        }

        .header h1 { font-size: 16px; font-weight: 700; color: var(--ios-text); }

        .notif-icon {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; display: flex; align-items: center;
        }
        .notif-icon svg { width: 22px; height: 22px; fill: var(--ios-text); }

        .notif-badge {
            position: absolute; top: -4px; right: -4px; background: var(--ios-red);
            color: white; font-size: 10px; font-weight: bold; padding: 2px 6px;
            border-radius: 10px; display: none;
        }
        .notif-badge.active { display: block; }

        .id-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.5); padding: 3px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 500; color: var(--ios-text); margin-top: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.6);
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--ios-red); border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.1); transition: background-color 0.3s ease;
        }
        .status-dot.online { background-color: var(--ios-green); }

        .connect-bar {
            padding: 10px 16px; display: flex; gap: 8px; background: rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); align-items: center; flex-shrink: 0;
        }

        .input-ios {
            width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--ios-glass-border);
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); font-size: 14px; outline: none; color: var(--ios-text);
            transition: all 0.2s;
        }
        .input-ios:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--ios-blue);
        }

        .btn-ios {
            background: var(--ios-blue); color: white; border: none; padding: 10px 14px;
            border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease; flex-shrink: 0;
        }
        .btn-ios:active { transform: scale(0.95); opacity: 0.85; }

        /* ZONE DU CHAT */
        .chat-box { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14px;
            line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s ease-out;
            min-width: 100px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent { 
            align-self: flex-end; 
            background: var(--ios-blue); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }
        .message.received { 
            align-self: flex-start; 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(10px); 
            color: var(--ios-text); 
            border-bottom-left-radius: 4px; 
        }

        /* MEDIA & AUDIOS */
        .media-preview {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            margin-top: 4px;
            display: block;
            object-fit: cover;
        }

        .audio-player-container {
            display: flex;
            align-items: center;
            width: 220px;
            padding: 4px 0;
        }

        .audio-player-container audio {
            width: 100%;
            height: 36px;
            outline: none;
        }

        /* BARRE DE SAISIE INFERIEURE */
        .input-bar {
            padding: 10px 14px max(12px, env(safe-area-inset-bottom)); 
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--ios-glass-border); 
            display: flex; 
            gap: 8px; 
            align-items: center;
            flex-shrink: 0;
        }

        .btn-attach, .btn-mic {
            background: rgba(255, 255, 255, 0.6); border: 1px solid var(--ios-glass-border);
            width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center;
            align-items: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
        }
        .btn-attach:active, .btn-mic:active { transform: scale(0.92); }

        .btn-mic.recording {
            background: var(--ios-red) !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .btn-attach svg, .btn-mic svg { width: 20px; height: 20px; fill: var(--ios-text); }
        .btn-mic.recording svg { fill: white; }

        #file-input, #avatar-input { display: none; }

        /* MODIFICATIONS RESPONSIVE (MOBILES & TABLETTES) */
        @media (max-width: 768px) {
            body { padding: 0; }
            .app-wrapper { 
                max-width: 100%; 
                max-height: 100%; 
                border-radius: 0; 
                border: none; 
            }
            .sidebar {
                position: absolute; 
                left: 0; top: 0; bottom: 0; 
                width: 82%;
                max-width: 310px;
                transform: translateX(-100%); 
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(25px);
                box-shadow: 10px 0 30px rgba(0,0,0,0.2);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; opacity: 1; }
            .menu-toggle { display: block; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- OVERLAY POUR FERMER LE MENU EN TOUCHANT L'ÉCRAN -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <!-- COMMUTATEUR DE LANGUE -->
        <div class="lang-switch-box">
            🌐 <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="fr">FR</option>
                <option value="en">EN</option>
            </select>
        </div>

        <div class="profile-card">
            <label class="avatar-upload" id="avatar-title" title="Changer de photo">
                <img id="avatar-img" src="https://via.placeholder.com/76?text=Photo" alt="Avatar">
                <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(this)">
            </label>
            <div class="profile-inputs">
                <input type="text" id="user-pseudo" class="input-ios" placeholder="Pseudo">
                <div style="display: flex; gap: 6px;">
                    <select id="user-gender" class="input-ios">
                        <option value="Non spécifié" id="opt-gender-default">Sexe</option>
                        <option value="H" id="opt-gender-m">Homme</option>
                        <option value="F" id="opt-gender-f">Femme</option>
                    </select>
                    <input type="number" id="user-age" class="input-ios" placeholder="Âge" style="width: 80px;">
                </div>
            </div>
            <button class="btn-save-profile" id="btn-save" onclick="saveProfile()">💾 Sauvegarder</button>
        </div>

        <div class="contacts-section">
            <h3 style="font-size: 13px; font-weight: 700; color: var(--ios-text);" id="txt-contacts-header">Contacts</h3>
            <input type="text" id="search-contact-input" class="input-ios" placeholder="🔍 Rechercher..." oninput="renderContacts()">
            
            <div class="add-contact-box">
                <input type="number" id="contact-id-input" class="input-ios" placeholder="ID (8 chiffres)">
                <button class="btn-ios" onclick="addContact()">+</button>
            </div>

            <div class="contact-list" id="contact-list"></div>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

            <div class="app-title-container">
                <svg class="app-logo" viewBox="0 0 24 24">
                    <path d="M12 2C7.58 2 4 5.58 4 10v9.5c0 .64.67 1.04 1.2.7l2.8-1.75 2.8 1.75c.37.23.83.23 1.2 0l2.8-1.75 2.8 1.75c.53.34 1.2-.06 1.2-.7V10c0-4.42-3.58-8-8-8zm-3 9c-.83 0-1.5-.67-1.5-1.5S8.17 8 9 8s1.5.67 1.5 1.5S9.83 11 9 11zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 8 15 8s1.5.67 1.5 1.5S15.83 11 15 11z"/>
                </svg>
                <h1>WraithChat</h1>
            </div>
            
            <div class="notif-icon" onclick="resetNotifications()" id="notif-reset-title" title="Réinitialiser les notifications">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span class="notif-badge" id="notif-badge">0</span>
            </div>

            <div class="id-badge">
                <span class="status-dot" id="server-status"></span>
                ID : <strong id="my-id">Connexion...</strong>
            </div>
        </div>

        <div class="connect-bar">
            <input type="number" id="target-id" class="input-ios" placeholder="ID du correspondant (8 chiffres)">
            <span class="status-dot" id="target-status"></span>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message received" id="welcome-msg" style="align-self: center; background: rgba(255,255,255,0.4); font-size: 12px; text-align: center; border-radius: 12px;">
                👻 WraithChat : Vos échanges sont éphémères et ne sont jamais stockés.
            </div>
        </div>

        <div class="input-bar">
            <!-- BOUTON FICHIERS & VIDÉOS -->
            <label class="btn-attach" id="btn-attach-title" title="Envoyer une image, vidéo ou fichier">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                <input type="file" id="file-input" onchange="sendP2PFile(this)">
            </label>
            
            <!-- BOUTON MICROPHONE VOCAL -->
            <button class="btn-mic" id="mic-btn" onclick="toggleAudioRecord()" title="Microphone Vocal">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>

            <input type="text" id="message-input" class="input-ios" placeholder="Message..." autocomplete="off">
            
            <button class="btn-ios" style="border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: white;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

            profileSaved: "Profile saved!",
            deleteContactConfirm: "Delete contact ",
            selectTargetAlert: "Select a recipient ID first!",
            micError: "Microphone access error: ",
            invalidIdAlert: "Invalid recipient ID (8 digits required).",
            fileTooHeavy: "File too large (max 35 MB).",
            downloadFile: "📁 Download file",
            notifNewMsg: "New message received",
            notifNewAudio: "🎤 New voice message",
            notifNewFile: "📁 New file / video"
        }
    };

    // AUDIO SYSTEM
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    let myProfile = JSON.parse(localStorage.getItem('teleguard_profile')) || {
        pseudo: '', gender: 'Non spécifié', age: '', avatar: ''
    };
    let contacts = JSON.parse(localStorage.getItem('teleguard_contacts')) || {};

    const serverStatus = document.getElementById('server-status');
    const targetStatus = document.getElementById('target-status');
    const targetInput = document.getElementById('target-id');

    if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('wraithchat_lang', lang);
        document.getElementById('lang-select').value = lang;
        document.documentElement.lang = lang;

        const t = translations[lang];
        document.getElementById('page-title').innerText = t.title;
        document.getElementById('avatar-title').title = t.avatarTitle;
        document.getElementById('user-pseudo').placeholder = t.pseudoPlaceholder;
        document.getElementById('opt-gender-default').innerText = t.genderDefault;
        document.getElementById('opt-gender-m').innerText = t.genderM;
        document.getElementById('opt-gender-f').innerText = t.genderF;
        document.getElementById('user-age').placeholder = t.agePlaceholder;
        document.getElementById('btn-save').innerText = t.btnSave;
        document.getElementById('txt-contacts-header').innerText = t.contactsHeader;
        document.getElementById('search-contact-input').placeholder = t.searchPlaceholder;
        document.getElementById('contact-id-input').placeholder = t.contactIdPlaceholder;
        document.getElementById('notif-reset-title').title = t.notifResetTitle;
        if (!myId) document.getElementById('my-id').innerText = t.connecting;
        document.getElementById('target-id').placeholder = t.targetPlaceholder;
        document.getElementById('welcome-msg').innerText = t.welcomeMsg;
        document.getElementById('btn-attach-title').title = t.attachTitle;
        document.getElementById('mic-btn').title = t.micTitle;
        document.getElementById('message-input').placeholder = t.messagePlaceholder;

        renderContacts();
    }

    // SOCKET.IO EVENTS
    socket.on('connect', () => {
        serverStatus.classList.add('online');
        socket.emit('register_user', { user_id: myId, profile: myProfile });
    });

    socket.on('disconnect', () => {
        serverStatus.classList.remove('online');
    });

    socket.on('registered', (data) => {
        myId = data.user_id;
        localStorage.setItem('teleguard_id', myId);
        document.getElementById('my-id').innerText = myId;
        broadcastProfile();
    });

    socket.on('receive_message', (msg) => {
        const currentTarget = targetInput.value.trim();
        
        if (msg.sender_id === currentTarget) {
            if (msg.type === 'text') {
                addMessage(msg.content, 'received');
            } else {
                renderMedia(msg.content, msg.file_type, 'received');
            }
        } else {
            triggerNotification(msg.sender_id, msg.type);
        }
    });

    socket.on('online_status', (data) => {
        if (data.target_id === targetInput.value.trim()) {
            if (data.is_online) targetStatus.classList.add('online');
            else targetStatus.classList.remove('online');
        }
    });

    // MESSAGES VOCAUX
    async function toggleAudioRecord() {
        const targetId = targetInput.value.trim();
        const t = translations[currentLang];
        if (!targetId || targetId.length !== 8) {
            alert(t.selectTargetAlert);
            return;
        }

        const micBtn = document.getElementById('mic-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                let options = {};
                if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
                else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const mime = mediaRecorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: mime });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const base64Audio = e.target.result;
                        socket.emit('send_message', {
                            type: 'audio',
                            sender_id: myId,
                            target_id: targetId,
                            file_type: mime,
                            content: base64Audio
                        });
                        renderMedia(base64Audio, mime, 'sent');
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (err) {
                alert(t.micError + err.message);
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    }

    // NOTIFICATIONS SYSTEME & BADGE
    function triggerNotification(senderId, msgType = 'text') {
        const t = translations[currentLang];
        totalUnreadCount++;
        const badge = document.getElementById('notif-badge');
        badge.innerText = totalUnreadCount;
        badge.classList.add('active');

        if (contacts[senderId]) {
            contacts[senderId].hasUnread = true;
            localStorage.setItem('teleguard_contacts', JSON.stringify(contacts));
            renderContacts();
        }

        if ("Notification" in window && Notification.permission === "granted") {
            const contactName = contacts[senderId] ? contacts[senderId].pseudo : `ID ${senderId}`;
            let text = t.notifNewMsg;
            if (msgType === 'audio') text = t.notifNewAudio;
            else if (msgType === 'video' || msgType === 'file') text = t.notifNewFile;

            new Notification(`WraithChat (${contactName})`, {
                body: text,
                icon: 'https://via.placeholder.com/128?text=WC'
            });
        }
    }

    function resetNotifications() {
        totalUnreadCount = 0;
        const badge = document.getElementById('notif-badge');
        badge.innerText = '0';
        badge.classList.remove('active');
    }

    // PROFIL & CONTACTS
    function initProfileUI() {
        document.getElementById('user-pseudo').value = myProfile.pseudo || '';
        document.getElementById('user-gender').value = myProfile.gender || 'Non spécifié';
        document.getElementById('user-age').value = myProfile.age || '';
        if (myProfile.avatar) document.getElementById('avatar-img').src = myProfile.avatar;
        changeLanguage(currentLang);
    }

    function saveProfile() {
        const t = translations[currentLang];
        myProfile.pseudo = document.getElementById('user-pseudo').value.trim();
        myProfile.gender = document.getElementById('user-gender').value;
        myProfile.age = document.getElementById('user-age').value.trim();
        localStorage.setItem('teleguard_profile', JSON.stringify(myProfile));
        broadcastProfile();
        alert(t.profileSaved);
    }

    function uploadAvatar(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            myProfile.avatar = e.target.result;
            document.getElementById('avatar-img').src = myProfile.avatar;
        };
        reader.readAsDataURL(file);
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    function addContact() {
        const idInput = document.getElementById('contact-id-input');
        const id = idInput.value.trim();
        if (id.length === 8 && !contacts[id]) {
            contacts[id] = { id: id, pseudo: `Contact ${id}`, gender: '', age: '', avatar: '', hasUnread: false };
            localStorage.setItem('teleguard_contacts', JSON.stringify(contacts));
            renderContacts();
            idInput.value = '';
        }
    }

    function deleteContact(e, id) {
        const t = translations[currentLang];
        e.stopPropagation();
        if (confirm(`${t.deleteContactConfirm} ${id} ?`)) {
            delete contacts[id];
            localStorage.setItem('teleguard_contacts', JSON.stringify(contacts));
            renderContacts();
        }
    }

    function selectContact(id) {
        targetInput.value = id;
        if (contacts[id] && contacts[id].hasUnread) {
            contacts[id].hasUnread = false;
            localStorage.setItem('teleguard_contacts', JSON.stringify(contacts));
            renderContacts();
        }
        checkTargetOnline();
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function renderContacts() {
        const t = translations[currentLang];
        const list = document.getElementById('contact-list');
        const query = document.getElementById('search-contact-input').value.toLowerCase().trim();
        list.innerHTML = '';

        Object.values(contacts).forEach(c => {
            if (!c.pseudo.toLowerCase().includes(query) && !c.id.includes(query)) return;

            const item = document.createElement('div');
            item.className = 'contact-item';
            item.onclick = () => selectContact(c.id);

            const avatarSrc = c.avatar || 'https://via.placeholder.com/40?text=U';
            
            let genderDisplay = c.gender;
            if (c.gender === 'H') genderDisplay = t.genderM;
            else if (c.gender === 'F') genderDisplay = t.genderF;
            else if (c.gender === 'Non spécifié') genderDisplay = '';

            const detailsText = [genderDisplay, c.age ? c.age + ' ' + t.yearsOld : ''].filter(Boolean).join(' • ') || t.noInfo;
            const unreadClass = c.hasUnread ? 'active' : '';

            item.innerHTML = `
                <img src="${avatarSrc}" class="contact-avatar">
                <div class="contact-info">
                    <span class="contact-name">${c.pseudo} (${c.id})</span>
                    <span class="contact-details">${detailsText}</span>
                </div>
                <div class="unread-dot ${unreadClass}"></div>
                <button class="btn-delete-contact" onclick="deleteContact(event, '${c.id}')">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            `;
            list.appendChild(item);
        });
    }

    function broadcastProfile() {
        const ids = Object.keys(contacts);
        if (ids.length > 0 && myId) {
            socket.emit('sync_profile', { sender_id: myId, target_ids: ids, profile: myProfile });
        }
    }

    function checkTargetOnline() {
        const tid = targetInput.value.trim();
        if (tid.length === 8) socket.emit('check_online', { target_id: tid });
        else targetStatus.classList.remove('online');
    }

    targetInput.addEventListener('input', checkTargetOnline);

    // ENVOI TEXTE ET FICHIERS
    function sendMessage() {
        const t = translations[currentLang];
        const targetId = targetInput.value.trim();
        const input = document.getElementById('message-input');
        const message = input.value.trim();

        if (!targetId || targetId.length !== 8) {
            alert(t.invalidIdAlert);
            return;
        }

        if (message !== "") {
            socket.emit('send_message', {
                type: 'text',
                sender_id: myId,
                target_id: targetId,
                content: message
            });
            addMessage(message, 'sent');
            input.value = '';
        }
    }

    function sendP2PFile(input) {
        const t = translations[currentLang];
        const targetId = targetInput.value.trim();
        if (!targetId || targetId.length !== 8) {
            alert(t.invalidIdAlert);
            input.value = '';
            return;
        }

        const file = input.files[0];
        if (!file) return;

        if (file.size > 35 * 1024 * 1024) {
            alert(t.fileTooHeavy);
            input.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const buffer = e.target.result;
            
            let fileTypeCategory = 'file';
            if (file.type.startsWith('image/')) fileTypeCategory = 'image';
            else if (file.type.startsWith('video/')) fileTypeCategory = 'video';
            else if (file.type.startsWith('audio/')) fileTypeCategory = 'audio';

            socket.emit('send_message', {
                type: fileTypeCategory,
                sender_id: myId,
                target_id: targetId,
                file_name: file.name,
                file_type: file.type,
                content: buffer
            });
            renderMedia(buffer, file.type, 'sent');
            input.value = '';
        };
        reader.readAsDataURL(file);
    }

    function addMessage(content, type, isMedia = false) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', type);
        
        if (isMedia) msgDiv.appendChild(content);
        else msgDiv.innerText = content;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderMedia(dataUrl, fileType, type) {
        const t = translations[currentLang];
        let el;
        const mime = fileType || '';

        if (mime.startsWith('image/')) {
            el = document.createElement('img');
            el.src = dataUrl;
            el.className = 'media-preview';
        } else if (mime.startsWith('video/')) {
            el = document.createElement('video');
            el.src = dataUrl;
            el.controls = true;
            el.className = 'media-preview';
            el.preload = 'metadata';
        } else if (mime.startsWith('audio/') || mime.includes('webm') || mime.includes('ogg') || mime.includes('mp4') || mime.includes('wav')) {
            const container = document.createElement('div');
            container.className = 'audio-player-container';
            
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = "metadata";
            audio.src = dataUrl;
            
            container.appendChild(audio);
            el = container;
        } else {
            el = document.createElement('a');
            el.href = dataUrl;
            el.download = "fichier";
            el.innerText = t.downloadFile;
            el.style.color = type === 'sent' ? '#ffffff' : '#007AFF';
        }
        
        addMessage(el, type, true);
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    initProfileUI();
</script>

</body>
</html>
